<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teams · ACS Interns 2026</title>
  <style>
    /* ACS Interns 2026 — Teams Page (matching design system exactly) */

    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap");

    /* ── Theme tokens (exact copy from index.css) ── */
    :root {
      --bg: #0A0A0A;
      --bg-alt: #111111;
      --bg-card: rgba(255, 255, 255, 0.025);
      --bg-card-hover: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --text-1: #FFFFFF;
      --text-2: #9A9A9A;
      --text-3: #555555;
      --red: #EB1C24;
      --red-glow: rgba(235, 28, 36, 0.15);
      --nav-bg: rgba(10, 10, 10, 0.65);
      --liquid-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035) 42%, rgba(235, 28, 36, 0.08));
      --liquid-border: rgba(255, 255, 255, 0.18);
      --liquid-highlight: rgba(255, 255, 255, 0.46);
      --liquid-shadow: 0 30px 90px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    [data-theme="light"] {
      --bg: #FAFAFA;
      --bg-alt: #FFFFFF;
      --bg-card: rgba(0, 0, 0, 0.02);
      --bg-card-hover: rgba(0, 0, 0, 0.04);
      --border: rgba(0, 0, 0, 0.06);
      --border-hover: rgba(0, 0, 0, 0.12);
      --text-1: #111111;
      --text-2: #666666;
      --text-3: #AAAAAA;
      --nav-bg: rgba(250, 250, 250, 0.7);
      --liquid-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.28) 48%, rgba(235, 28, 36, 0.08));
      --liquid-border: rgba(255, 255, 255, 0.86);
      --liquid-highlight: rgba(255, 255, 255, 0.9);
      --liquid-shadow: 0 28px 80px rgba(20, 20, 20, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    /* ── Base ── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.6s ease, color 0.6s ease;
      overflow-x: hidden;
    }

    ::selection {
      background: #EB1C24;
      color: white;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Film grain (matching body::before) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 10000;
      pointer-events: none;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #EB1C24;
    }

    .app-shell {
      min-height: 100vh;
      position: relative;
      background: linear-gradient(180deg, rgba(235, 28, 36, 0.035), transparent 18rem), var(--bg);
    }

    /* ── Reveal animation (exact match) ── */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 780ms ease, transform 980ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Kicker & Heading (exact from HomeSections.css) ── */
    .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1rem;
      color: var(--red);
      font-size: 0.64rem;
      font-weight: 850;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .section-kicker::before {
      content: '';
      width: 36px;
      height: 2px;
      background: currentColor;
      box-shadow: 0 0 18px rgba(235, 28, 36, 0.55);
    }

    .section-heading {
      margin: 0;
      color: var(--text-1);
      font-size: clamp(2.4rem, 6.8vw, 6rem);
      font-weight: 880;
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-wrap: balance;
    }

    .section-copy {
      margin: 1.3rem 0 0;
      max-width: 600px;
      color: var(--text-2);
      font-size: clamp(0.95rem, 1.5vw, 1.08rem);
      line-height: 1.8;
    }

    /* ── Navbar (exact from Navbar.css) ── */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.15rem clamp(1.2rem, 4vw, 3rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media(min-width:768px) {
      .navbar {
        padding: 1.25rem 3rem;
      }
    }

    .navbar--scrolled {
      background: var(--liquid-bg);
      backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      -webkit-backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      border-bottom: 1px solid var(--liquid-border);
      box-shadow: 0 18px 58px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      padding-top: 0.85rem;
      padding-bottom: 0.85rem;
    }

    .navbar__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-1);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: opacity 0.3s;
    }

    .navbar:not(.navbar--scrolled) .navbar__brand,
    .navbar:not(.navbar--scrolled) .navbar__link {
      color: #fff;
    }

    .navbar__brand:hover {
      opacity: 0.7;
    }

    .navbar__brand-logo {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .navbar__brand:hover .navbar__brand-logo {
      transform: scale(1.06);
    }

    .navbar__brand-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    .navbar__links {
      display: none;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    @media(min-width:768px) {
      .navbar__links {
        display: flex;
        align-items: center;
      }
    }

    .navbar__link {
      position: relative;
      color: var(--text-3);
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      transition: color 0.3s;
      padding: 8px 14px;
      text-transform: uppercase;
    }

    .navbar__link:hover {
      color: var(--text-1);
    }

    .navbar__link::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--red);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateX(-50%);
    }

    .navbar__link:hover::after {
      width: 14px;
    }

    .navbar__link--active {
      color: var(--text-1);
    }

    .navbar__link--active::after {
      width: 14px;
    }

    .navbar__right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .navbar__theme-toggle {
      position: relative;
      background: var(--liquid-bg);
      backdrop-filter: blur(24px) saturate(1.8);
      -webkit-backdrop-filter: blur(24px) saturate(1.8);
      border: 1px solid var(--liquid-border);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      min-width: 92px;
      height: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      cursor: pointer;
      color: var(--text-2);
      font-size: 0.52rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .navbar__theme-toggle::before {
      content: '';
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: #EB1C24;
      transition: transform .3s cubic-bezier(.16, 1, .3, 1);
    }

    .navbar__theme-toggle--dark::before {
      transform: translateX(100%);
    }

    .navbar__theme-toggle span {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .navbar__theme-toggle--light span:first-child,
    .navbar__theme-toggle--dark span:last-child {
      color: #fff;
    }

    .navbar__theme-toggle:hover {
      border-color: rgba(235, 28, 36, 0.36);
      color: var(--red);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.17), rgba(235, 28, 36, 0.09));
    }

    /* ── Footer (exact from Footer.css) ── */
    .footer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.2rem clamp(1.25rem, 5vw, 4rem);
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
    }

    .footer__mark {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: #111;
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer__links {
      display: flex;
      align-items: center;
      gap: clamp(0.8rem, 2vw, 1.4rem);
    }

    .footer__links a {
      color: rgba(0, 0, 0, 0.58);
      text-decoration: none;
      font-size: 0.64rem;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: color 220ms ease;
    }

    .footer__links a:hover {
      color: #EB1C24;
    }

    html[data-theme="dark"] .footer {
      border-top-color: rgba(255, 255, 255, 0.12);
      background: rgba(10, 10, 10, 0.78);
    }

    html[data-theme="dark"] .footer__mark {
      color: #fff;
    }

    html[data-theme="dark"] .footer__links a {
      color: rgba(255, 255, 255, 0.62);
    }

    /* ── View stage ── */
    .view-stage {
      flex: 1;
      transition: opacity 320ms ease, transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .view-stage.is-out {
      opacity: 0;
      transform: translateY(8px);
    }

    /* ══════════════════════════════════════════════════
   TEAMS HERO
   ══════════════════════════════════════════════════ */
    .teams-page {
      padding-top: 80px;
    }

    .teams-hero {
      position: relative;
      min-height: 86vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: clamp(7rem, 12vh, 9rem) clamp(1.25rem, 5vw, 4rem) 5rem;
      background: #030303;
      isolation: isolate;
    }

    .teams-hero__mesh {
      position: absolute;
      inset: 0;
      z-index: -4;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.76) 43%, rgba(0, 0, 0, 0.28) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 45%, var(--bg) 100%);
    }

    .teams-hero__grid {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 76px 76px;
      mask-image: linear-gradient(90deg, #000, transparent 74%);
    }

    .teams-hero__beam {
      position: absolute;
      z-index: -3;
      width: 54vw;
      height: 14vh;
      right: -12vw;
      background: linear-gradient(90deg, transparent, rgba(235, 28, 36, 0.34), transparent);
      filter: blur(26px);
      transform: rotate(-18deg);
    }

    .teams-hero__beam--one {
      top: 22%;
    }

    .teams-hero__beam--two {
      bottom: 16%;
      opacity: 0.45;
      transform: rotate(16deg);
    }

    .teams-hero__content {
      max-width: 860px;
      z-index: 2;
      opacity: 0;
      transform: translateY(34px);
      transition: opacity 900ms ease, transform 1100ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .teams-hero__content.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .teams-hero__title {
      max-width: 980px;
      margin: 0;
      color: #fff;
      font-size: clamp(3rem, 8.4vw, 7.9rem);
      font-weight: 850;
      letter-spacing: -0.055em;
      line-height: 0.88;
      text-wrap: balance;
    }

    .teams-hero__copy {
      max-width: 620px;
      margin: 1.8rem 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: clamp(0.95rem, 1.7vw, 1.12rem);
      line-height: 1.8;
    }

    .teams-hero__stats {
      display: flex;
      gap: 2.8rem;
      margin-top: 2.6rem;
    }

    .teams-hero__stat-num {
      color: var(--red);
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.06em;
    }

    .teams-hero__stat-label {
      margin-top: 0.45rem;
      color: rgba(255, 255, 255, 0.44);
      font-size: 0.62rem;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    /* ══════════════════════════════════════════════════
   TEAMS SECTION & GRID
   ══════════════════════════════════════════════════ */
    .teams-section {
      position: relative;
      overflow: hidden;
      padding: clamp(5rem, 10vw, 9rem) clamp(1.25rem, 5vw, 4rem);
    }

    .teams-section::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 88px 88px;
      opacity: 0.28;
      mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
    }

    .teams-section__header {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto 3rem;
    }

    .teams-grid {
      position: relative;
      z-index: 1;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    /* ── Team Tile (liquid-glass card) ── */
    .team-tile {
      position: relative;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      padding: 1.4rem;
      text-align: left;
      border: 1px solid var(--liquid-border);
      border-radius: 8px;
      background: var(--liquid-bg);
      backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      -webkit-backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      box-shadow: var(--liquid-shadow);
      transition: transform 260ms ease, border-color 260ms ease, background 260ms ease;
    }

    .team-tile:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.055) 42%, rgba(235, 28, 36, 0.12));
    }

    /* Shimmer highlight (::before) */
    .team-tile__highlight {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(circle at 16% 12%, var(--liquid-highlight), transparent 0.7rem),
        radial-gradient(circle at 86% 18%, rgba(235, 28, 36, 0.2), transparent 7rem),
        linear-gradient(120deg, rgba(255, 255, 255, 0.24), transparent 28%, rgba(255, 255, 255, 0.08) 62%, transparent);
      opacity: 0.58;
      mix-blend-mode: screen;
    }

    /* Sweep shine (::after equivalent) */
    .team-tile__shine {
      position: absolute;
      inset: -45%;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.22), transparent 64%);
      transform: translateX(-45%) rotate(8deg);
      transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .team-tile:hover .team-tile__shine {
      transform: translateX(42%) rotate(8deg);
    }

    /* RED SHUTTER — sweeps up from bottom on hover */
    .team-tile__shutter {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: linear-gradient(0deg,
          rgba(235, 28, 36, 0.95),
          rgba(235, 28, 36, 0.6) 40%,
          rgba(235, 28, 36, 0.0) 100%);
      transform: translateY(101%);
      transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 0;
      pointer-events: none;
    }

    .team-tile.is-hovered .team-tile__shutter {
      transform: translateY(60%);
    }

    .team-tile.is-hovered {
      border-color: rgba(235, 28, 36, 0.5);
    }

    .team-tile.is-hovered .team-tile__count {
      color: #fff;
    }

    .team-tile.is-hovered .team-tile__chip {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .team-tile__top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-tile__kicker {
      color: var(--red);
      font-size: 0.64rem;
      font-weight: 850;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(235, 28, 36, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .team-tile__num {
      color: var(--text-3);
      font-size: 0.62rem;
      font-weight: 850;
      letter-spacing: 0.16em;
    }

    .team-tile__body {
      position: relative;
      z-index: 1;
      flex: 1;
      margin-top: 2.2rem;
    }

    .team-tile__name {
      margin: 0;
      color: var(--text-1);
      font-size: clamp(1.6rem, 3.2vw, 2.2rem);
      font-weight: 880;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .team-tile__tagline {
      margin: 0.85rem 0 0;
      color: var(--text-2);
      font-size: 0.82rem;
      line-height: 1.65;
      max-width: 90%;
    }

    .team-tile__stack {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 1.6rem;
    }

    .team-tile__chip {
      padding: 0.42rem 0.55rem;
      color: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font-size: 0.62rem;
      font-weight: 700;
    }

    .team-tile__foot {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
    }

    .team-tile__count {
      color: var(--text-3);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 400ms ease;
    }

    /* Interactive CTA arrow */
    .team-tile__cta {
      display: inline-flex;
      align-items: center;
      color: var(--text-3);
      transition: all 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .team-tile__cta-text {
      display: none;
    }

    .team-tile__cta-icon {
      display: inline-flex;
      align-items: center;
      transition: transform 320ms cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateX(-4px);
      opacity: 0;
    }

    .team-tile.is-hovered .team-tile__cta {
      color: var(--red);
    }

    .team-tile.is-hovered .team-tile__cta-icon {
      transform: translateX(0);
      opacity: 1;
    }

    [data-theme="light"] .team-tile__chip {
      color: rgba(0, 0, 0, 0.68);
      border-color: rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.56);
    }

    /* ══════════════════════════════════════════════════
   DETAIL PAGE
   ══════════════════════════════════════════════════ */
    .detail-page {
      padding: 100px clamp(1.25rem, 5vw, 4rem) 4rem;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .detail-back {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1rem 0.55rem 0.55rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px) saturate(1.55);
      -webkit-backdrop-filter: blur(20px) saturate(1.55);
      color: var(--text-2);
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 220ms ease, background 220ms ease, color 220ms ease;
      margin-bottom: 2rem;
    }

    .detail-back:hover {
      color: #fff;
      background: #EB1C24;
      transform: translateY(-2px);
    }

    .detail-back__arrow {
      font-size: 1rem;
    }

    /* Detail Hero */
    .detail-hero {
      position: relative;
      overflow: hidden;
      padding: 2rem;
      border: 1px solid var(--liquid-border);
      border-radius: 8px;
      background: var(--liquid-bg);
      backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      -webkit-backdrop-filter: blur(34px) saturate(1.9) contrast(1.06);
      box-shadow: var(--liquid-shadow);
      margin-bottom: 3rem;
    }

    .detail-hero__mesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 12%, var(--liquid-highlight), transparent 0.7rem),
        radial-gradient(circle at 86% 18%, rgba(235, 28, 36, 0.2), transparent 7rem),
        linear-gradient(120deg, rgba(255, 255, 255, 0.24), transparent 28%, rgba(255, 255, 255, 0.08) 62%, transparent);
      opacity: 0.58;
      mix-blend-mode: screen;

    .detail-hero__main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: clamp(2rem, 5vw, 4rem);
      align-items: start;
      margin-top: 1.5rem;
    }

    .detail-hero__title {
      margin: 0;
      color: var(--text-1);
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .detail-hero__tagline {
      margin: 1rem 0 0;
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .detail-hero__desc {
      margin: 1rem 0 0;
      color: var(--text-2);
      font-size: 0.92rem;
      line-height: 1.75;
    }

    .liquid-glass-card {
      border: 1px solid var(--liquid-border);
      border-radius: 8px;
      background: var(--liquid-bg);
      backdrop-filter: blur(30px) saturate(1.85);
      -webkit-backdrop-filter: blur(30px) saturate(1.85);
      box-shadow: var(--liquid-shadow);
      padding: 1rem;
    }

    .glass {
      background: var(--liquid-bg);
      backdrop-filter: blur(30px) saturate(1.85) contrast(1.05);
      -webkit-backdrop-filter: blur(30px) saturate(1.85) contrast(1.05);
      border: 1px solid var(--liquid-border);
      box-shadow: var(--liquid-shadow);
    }

    .detail-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-meta-row:last-child {
      border-bottom: none;
    }

    .detail-meta-label {
      color: var(--text-3);
      font-size: 0.62rem;
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;

    .detail-meta-value {
      color: var(--text-1);
      font-size: 0.82rem;
      font-weight: 600;
      text-align: right;
      max-width: 60%;

    /* Roster bar */
    .roster-bar {

      margin-bottom: 1.5rem;
      gap: 1rem;

    /* Members grid */
    .members-grid {

      grid-template-columns: repeat(4, minmax(0, 1fr));

    /* ── Member card ──────────────────────────────────────────── */
    .member-card {

      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      color: var(--text-1);
      opacity: 0;
      transform: translateY(24px);
      transition:

      background: var(--liquid-bg);

      box-shadow: var(--liquid-shadow);

    .members-grid:hover .member-card:not(:hover) {
      opacity: 0.4;
      filter: grayscale(60%);

    .member-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        radial-gradient(circle at 16% 12%, var(--liquid-highlight), transparent 0.7rem),
        radial-gradient(circle at 86% 18%, rgba(235, 28, 36, 0.2), transparent 7rem),
        linear-gradient(120deg, rgba(255, 255, 255, 0.24), transparent 28%, rgba(255, 255, 255, 0.08) 62%, transparent);
      opacity: 0.58;
      mix-blend-mode: screen;

    .member-card.is-visible {
      opacity: 1;
      transform: translateY(0);

    .member-card>* {

    .member-card:hover {

    .member-card__redbar {

      left: 0;
      top: 0;
      right: 0;
      height: 3px;

      transform: scaleX(0);
      transform-origin: left;
      transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 2;

    .member-card:hover .member-card__redbar {

    /* Hover shine */
    .member-card__shine {

      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.22), transparent 64%);

      transition: transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;

    .member-card:hover .member-card__shine {

      letter-spacing: -0.02em;
      line-height: 1.15;

    .member-card__role {

      font-size: 0.72rem;
      font-weight: 600;
      color: var(--red);

    /* Skills chips */
    .member-card__skills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;

    .member-card__chip {
      display: inline-block;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-2);

    .member-card:hover .member-card__chip {
      border-color: var(--border-hover);
      color: var(--text-1);

    .member-card__foot {

      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      margin-top: auto;
      border-top: 1px solid var(--border);

      border-color: var(--border-hover);

    .member-card__uni {
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .member-card__arrow {

      color: var(--text-3);
      transition: all 280ms;
      flex-shrink: 0;
      margin-left: 8px;

    .member-card:hover .member-card__arrow {
      color: var(--red);

    @media (prefers-reduced-motion: reduce) {

      aspect-ratio: 1;
      border: 1px solid var(--border-hover);
    }

    .member-modal__portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(20%);
      transition: filter 0.4s;

    .member-modal__portrait:hover {
      filter: grayscale(0%);

    .member-modal__team-badge {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--red);
      text-align: center;
    }

    .member-modal__socials {
      margin-top: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;

    .member-modal__social-link {
      display: flex;
      align-items: center;

      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-hover);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-2);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .member-modal__social-link:hover {
      background: rgba(235, 28, 36, 0.15);
      border-color: rgba(235, 28, 36, 0.35);
      color: var(--red);
      box-shadow: 0 4px 16px rgba(235, 28, 36, 0.25);
      transform: translateY(-2px);
    }

    .member-modal__social-link--linkedin:hover {
      background: rgba(235, 28, 36, 0.15);
      border-color: rgba(235, 28, 36, 0.35);
      color: var(--red);
    }

    .member-modal__name {
      margin: 0 0 0.25rem;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 800;
      color: var(--text-1);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .member-modal__role {
      margin: 0 0 0.15rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--red);
    }

    .member-modal__university {
      margin: 0 0 1.25rem;
      font-size: 0.8rem;
      color: var(--text-2);

    @media (max-width: 600px) {

    [data-theme="light"] .teams-hero__mesh {

    // ── useTweaks ───────────────────────────────────────────────────────────────
    // Single source of truth for tweak values. setTweak persists via the host
    // (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
    function useTweaks(defaults) {
      const [values, setValues] = React.useState(defaults);
      // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
      // useState-style call doesn't write a "[object Object]" key into the persisted
      // JSON block.
      const setTweak = React.useCallback((keyOrEdits, val) => {
        const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
          ? keyOrEdits : { [keyOrEdits]: val };
        setValues((prev) => ({ ...prev, ...edits }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
      }, []);
      return [values, setTweak];
    }

    // ── TweaksPanel ─────────────────────────────────────────────────────────────
    // Floating shell. Registers the protocol listener BEFORE announcing
    // availability — if the announce ran first, the host's activate could land
    // before our handler exists and the toolbar toggle would silently no-op.
    // The close button posts __edit_mode_dismissed so the host's toolbar toggle
    // flips off in lockstep; the host echoes __deactivate_edit_mode back which
    // is what actually hides the panel.
    function TweaksPanel({ title = 'Tweaks', children }) {
      const [open, setOpen] = React.useState(false);
      const dragRef = React.useRef(null);
      const offsetRef = React.useRef({ x: 16, y: 16 });
      const PAD = 16;

      const clampToViewport = React.useCallback(() => {
        const panel = dragRef.current;
        if (!panel) return;
        const w = panel.offsetWidth, h = panel.offsetHeight;
        const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
        const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
        offsetRef.current = {
          x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
          y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
        };
        panel.style.right = offsetRef.current.x + 'px';
        panel.style.bottom = offsetRef.current.y + 'px';
      }, []);

      React.useEffect(() => {
        if (!open) return;
        clampToViewport();
        if (typeof ResizeObserver === 'undefined') {
          window.addEventListener('resize', clampToViewport);
          return () => window.removeEventListener('resize', clampToViewport);
        }
        const ro = new ResizeObserver(clampToViewport);
        ro.observe(document.documentElement);
        return () => ro.disconnect();
      }, [open, clampToViewport]);

      React.useEffect(() => {
        const onMsg = (e) => {
          const t = e?.data?.type;
          if (t === '__activate_edit_mode') setOpen(true);
          else if (t === '__deactivate_edit_mode') setOpen(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const dismiss = () => {
        setOpen(false);
        window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
      };

      const onDragStart = (e) => {
        const panel = dragRef.current;
        if (!panel) return;
        const r = panel.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const startRight = window.innerWidth - r.right;
        const startBottom = window.innerHeight - r.bottom;
        const move = (ev) => {
          offsetRef.current = {
            x: startRight - (ev.clientX - sx),
            y: startBottom - (ev.clientY - sy),
          };
          clampToViewport();
        };
        const up = () => {
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        };
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      };

      if (!open) return null;
      return (
        <>
          <style>{__TWEAKS_STYLE}</style>
          <div ref={dragRef} className="twk-panel" data-noncommentable=""
            style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
            <div className="twk-hd" onMouseDown={onDragStart}>
              <b>{title}</b>
              <button className="twk-x" aria-label="Close tweaks"
                onMouseDown={(e) => e.stopPropagation()}
                onClick={dismiss}>✕</button>
            </div>
            <div className="twk-body">{children}</div>
          </div>
        </>
      );
    }

    // ── Layout helpers ──────────────────────────────────────────────────────────

    function TweakSection({ label, children }) {
      return (
        <>
          <div className="twk-sect">{label}</div>
          {children}
        </>
      );
    }

    function TweakRow({ label, value, children, inline = false }) {
      return (
        <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
          <div className="twk-lbl">
            <span>{label}</span>
            {value != null && <span className="twk-val">{value}</span>}
          </div>
          {children}
        </div>
      );
    }

    // ── Controls ────────────────────────────────────────────────────────────────

    function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
      return (
        <TweakRow label={label} value={`${value}${unit}`}>
          <input type="range" className="twk-slider" min={min} max={max} step={step}
            value={value} onChange={(e) => onChange(Number(e.target.value))} />

      );
    }

    function TweakToggle({ label, value, onChange }) {
      return (
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>{label}</span></div>
          <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
            role="switch" aria-checked={!!value}
            onClick={() => onChange(!value)}><i /></button>
        </div>
      );
    }

    function TweakRadio({ label, value, options, onChange }) {
      const trackRef = React.useRef(null);
      const [dragging, setDragging] = React.useState(false);
      const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
      const idx = Math.max(0, opts.findIndex((o) => o.value === value));
      const n = opts.length;

      // The active value is read by pointer-move handlers attached for the lifetime
      // of a drag — ref it so a stale closure doesn't fire onChange for every move.
      const valueRef = React.useRef(value);
      valueRef.current = value;

      const segAt = (clientX) => {
        const r = trackRef.current.getBoundingClientRect();
        const inner = r.width - 4;
        const i = Math.floor(((clientX - r.left - 2) / inner) * n);
        return opts[Math.max(0, Math.min(n - 1, i))].value;
      };

      const onPointerDown = (e) => {
        setDragging(true);
        const v0 = segAt(e.clientX);
        if (v0 !== valueRef.current) onChange(v0);
        const move = (ev) => {
          if (!trackRef.current) return;
          const v = segAt(ev.clientX);
          if (v !== valueRef.current) onChange(v);
        };
        const up = () => {
          setDragging(false);
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };

      return (
        <TweakRow label={label}>
          <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
            className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
            <div className="twk-seg-thumb"
              style={{
                left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                width: `calc((100% - 4px) / ${n})`
              }} />
            {opts.map((o) => (
              <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
                {o.label}
              </button>
            ))}
          </div>
        </TweakRow>
      );
    }

    function TweakSelect({ label, value, options, onChange }) {
      return (
        <TweakRow label={label}>
          <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
            {options.map((o) => {
              const v = typeof o === 'object' ? o.value : o;
              const l = typeof o === 'object' ? o.label : o;
              return <option key={v} value={v}>{l}</option>;
            })}
          </select>
        </TweakRow>
      );
    }

    function TweakText({ label, value, placeholder, onChange }) {
      return (
        <TweakRow label={label}>
          <input className="twk-field" type="text" value={value} placeholder={placeholder}
            onChange={(e) => onChange(e.target.value)} />
        </TweakRow>
      );
    }

    function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
      const clamp = (n) => {
        if (min != null && n < min) return min;
        if (max != null && n > max) return max;
        return n;
      };
      const startRef = React.useRef({ x: 0, val: 0 });
      const onScrubStart = (e) => {
        e.preventDefault();
        startRef.current = { x: e.clientX, val: value };
        const decimals = (String(step).split('.')[1] || '').length;
        const move = (ev) => {
          const dx = ev.clientX - startRef.current.x;
          const raw = startRef.current.val + dx * step;
          const snapped = Math.round(raw / step) * step;
          onChange(clamp(Number(snapped.toFixed(decimals))));
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      };
      return (
        <div className="twk-num">
          <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
          <input type="number" value={value} min={min} max={max} step={step}
            onChange={(e) => onChange(clamp(Number(e.target.value)))} />
          {unit && <span className="twk-num-unit">{unit}</span>}
        </div>
      );
    }

    function TweakColor({ label, value, onChange }) {
      return (
        <div className="twk-row twk-row-h">
          <div className="twk-lbl"><span>{label}</span></div>
          <input type="color" className="twk-swatch" value={value}
            onChange={(e) => onChange(e.target.value)} />
        </div>
      );
    }

    function TweakButton({ label, onClick, secondary = false }) {
      return (
        <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
          onClick={onClick}>{label}</button>
      );
    }

    Object.assign(window, {
      useTweaks, TweaksPanel, TweakSection, TweakRow,
      TweakSlider, TweakToggle, TweakRadio, TweakSelect,
      TweakText, TweakNumber, TweakColor, TweakButton,
    });

  </script>

      dacoe: [["Adobe Analytics", "SQL"], ["Launch", "JavaScript"], ["Power BI", "DAX"], ["Excel", "Looker"]],
      aem: [["Java", "Sling", "HTL"], ["AEM", "OSGi", "JCR"], ["Maven", "Jenkins", "AEM"], ["GraphQL", "Java", "AEM"]],
      workfront: [["Workfront Fusion", "JS"], ["REST APIs", "Node"], ["Workfront", "SQL"], ["Automation", "Zapier"]],
      content: [["UX Writing", "Figma"], ["SEO", "Strategy"], ["Editorial", "CMS"], ["Localization", "i18n"]],
    };
    const PROJECTS_BY_TEAM = {
      ui: [{ name: "Spectrum Tokens v3", url: "#" }, { name: "Dashboard Redesign", url: "#" }, { name: "Component Migration", url: "#" }, { name: "Marketing Site Refresh", url: "#" }],
      data: [{ name: "Unified Event Pipeline", url: "#" }, { name: "Cohort Modeling v2", url: "#" }, { name: "Real-time Lakehouse", url: "#" }, { name: "Anomaly Detection", url: "#" }],
      dacoe: [{ name: "Funnel Instrumentation", url: "#" }, { name: "Attribution Model", url: "#" }, { name: "Executive Reporting", url: "#" }, { name: "Tag Governance", url: "#" }],
      aem: [{ name: "Headless Migration", url: "#" }, { name: "Personalization Engine", url: "#" }, { name: "Asset Pipeline", url: "#" }, { name: "Multi-site Templates", url: "#" }],
      workfront: [{ name: "Request Intake Automation", url: "#" }, { name: "Approval Routing v2", url: "#" }, { name: "Capacity Dashboard", url: "#" }, { name: "Fusion Connectors", url: "#" }],
      content: [{ name: "Voice & Tone Guide", url: "#" }, { name: "Onboarding Copy Audit", url: "#" }, { name: "Help Center Rewrite", url: "#" }, { name: "Localization Playbook", url: "#" }],
    };
    const BIOS = [
      "Spends weekends rebuilding mechanical keyboards and arguing about kerning. Believes good software has good rhythm.",
      "Came to Adobe through a research project on perceptual color spaces. Currently obsessed with making dashboards readable in three glances or fewer.",
      "Former architecture student. Treats every component like a load-bearing wall — measured, intentional, hard to break.",
      "Reads release notes for fun. Writes them better than most people write essays.",
      "Trail runner, type nerd, and the unofficial team historian. Owns more Pantone books than is reasonable.",
      "Picked up code through making mods for indie games. Now applies the same patience to enterprise tooling.",
      "Bilingual product thinker who translates ambiguity into roadmaps. Fluent in spreadsheet.",
      "Cares deeply about documentation. Has strong, well-formed opinions about empty states.",
      "Studies jazz piano on the side and applies the same improvisation to debugging at 4pm on Fridays.",
      "Once shipped a side project that hit the front page of Hacker News. Still gets nervous before standups.",
      "Comes from a journalism background. Brings the discipline of editing to every PR review.",
      "Makes ceramics on weekends. Believes in slow craft and tight feedback loops.",
    ];

    function seededRandom(seed) {
      let s = seed;
      return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    }
    function pick(arr, rnd) { return arr[Math.floor(rnd() * arr.length)]; }

    function generateMembers(teamId, count, seed) {
      const rnd = seededRandom(seed);
      const used = new Set();
      const out = [];
      let i = 0;
      while (out.length < count && i < count * 10) {
        i++;
        const first = pick(FIRST_NAMES, rnd);
        const last = pick(LAST_NAMES, rnd);
        const full = `${first} ${last}`;
        if (used.has(full)) continue;
        used.add(full);
        const handle = `${first.toLowerCase()}${last.toLowerCase()}`;
        out.push({
          id: `${teamId}-${out.length}`,
          name: full,
          initials: (first[0] + last[0]).toUpperCase(),
          role: pick(ROLES_BY_TEAM[teamId], rnd),
          university: pick(UNIVERSITIES, rnd),
          batch: pick(BATCHES, rnd),
          skills: pick(SKILLS_BY_TEAM[teamId], rnd),
          project: pick(PROJECTS_BY_TEAM[teamId], rnd),
          bio: pick(BIOS, rnd),
          mentor: pick(FIRST_NAMES, rnd) + " " + pick(LAST_NAMES, rnd),
          github: `https://github.com/${handle}`,
          linkedin: `https://linkedin.com/in/${handle}`,
          avatarHue: Math.floor(rnd() * 360),
        });
      }
      return out;
    }

    const MEMBERS_BY_TEAM = {
      ui: generateMembers("ui", 8, 11),
      data: generateMembers("data", 8, 22),
      dacoe: generateMembers("dacoe", 8, 33),
      aem: generateMembers("aem", 8, 44),
      workfront: generateMembers("workfront", 8, 55),
      content: generateMembers("content", 8, 66),
    };

    const AVATAR_COLORS = [

      { bg: 'rgba(59, 130, 246, 0.15)', color: '#3B82F6' },
      { bg: 'rgba(34, 197, 94, 0.15)', color: '#22C55E' },
      { bg: 'rgba(168, 85, 247, 0.15)', color: '#A855F7' },
      { bg: 'rgba(245, 158, 11, 0.15)', color: '#F59E0B' },
      { bg: 'rgba(236, 72, 153, 0.15)', color: '#EC4899' },
    ];

    window.TEAMS = TEAMS;
    window.MEMBERS_BY_TEAM = MEMBERS_BY_TEAM;
    window.AVATAR_COLORS = AVATAR_COLORS;

  </script>

  <script type="text/babel" data-presets="react">
    // App shell — v3 matching ACS design system

    const { useState: useStateA, useEffect: useEffectA, useCallback: useCallbackA } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [view, setView] = useStateA({ name: 'overview' });
      const [modalMember, setModalMember] = useStateA(null);
      const [transitioning, setTransitioning] = useStateA(false);

      useEffectA(() => {
        document.documentElement.setAttribute('data-theme', tweaks.theme);
        document.documentElement.style.colorScheme = tweaks.theme;
      }, [tweaks.theme]);

      function goToTeam(teamId) {
        setTransitioning(true);
        setTimeout(() => {
          setView({ name: 'detail', teamId });
          window.scrollTo(0, 0);
          setTransitioning(false);
        }, 300);
      }

      function goBack() {
        setTransitioning(true);
        setTimeout(() => {
          setView({ name: 'overview' });
          window.scrollTo(0, 0);
          setTransitioning(false);
        }, 300);
      }

      return (
        <div className="app-shell">
          <Navbar theme={tweaks.theme} onToggleTheme={() => setTweak('theme', tweaks.theme === 'dark' ? 'light' : 'dark')} />

          <main className={`view-stage ${transitioning ? 'is-out' : ''}`}>
            {view.name === 'overview' && <TeamsOverview onSelectTeam={goToTeam} />}
            {view.name === 'detail' && (
              <TeamDetail
                teamId={view.teamId}
                onBack={goBack}
                onSelectMember={(m) => setModalMember(m)}
              />
            )}
          </main>

          <Footer />

          {modalMember && (
            <MemberModal
              member={modalMember}
              team={TEAMS.find((t) => MEMBERS_BY_TEAM[t.id].some((m) => m.id === modalMember.id))}
              onClose={() => setModalMember(null)}
            />
          )}

          <TweaksPanel title="Tweaks">
            <TweakSection title="Appearance">
              <TweakRadio
                label="Theme"
                value={tweaks.theme}
                options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]}
                onChange={(v) => setTweak('theme', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    function Navbar({ theme, onToggleTheme }) {
      const [scrolled, setScrolled] = useStateA(false);
      useEffectA(() => {
        const onScroll = () => setScrolled(window.scrollY > 30);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <nav className={`navbar ${scrolled ? 'navbar--scrolled' : ''}`}>
          <a className="navbar__brand" href="#">
            <span className="navbar__brand-logo">
              <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
                <rect width="100" height="100" fill="rgba(255,255,255,0.06)" rx="6" />
                <polygon points="8,8 42,8 8,92" fill="#EB1C24" />
                <polygon points="58,8 92,8 92,92" fill="#EB1C24" />
                <polygon points="50,28 68,78 50,78 44,62 32,78 50,78" fill="#EB1C24" />
              </svg>
            </span>
            <span className="navbar__brand-sep" />
            <span>ACS Interns 2026</span>
          </a>

          <ul className="navbar__links">
            <li><a className="navbar__link" href="#">Home</a></li>
            <li><a className="navbar__link" href="#">Gallery</a></li>
            <li><a className="navbar__link navbar__link--active" href="#">Teams</a></li>
            <li><a className="navbar__link" href="#">Projects</a></li>
          </ul>

          <div className="navbar__right">
            <button
              className={`navbar__theme-toggle navbar__theme-toggle--${theme}`}
              onClick={onToggleTheme}
              role="switch"
            >
              <span>Light</span>
              <span>Dark</span>
            </button>
          </div>
        </nav>
      );
    }

    function Footer() {
      return (
        <footer className="footer">
          <div className="footer__mark">
            <svg width="24" height="24" viewBox="0 0 100 100" fill="none">
              <polygon points="8,8 42,8 8,92" fill="#EB1C24" />
              <polygon points="58,8 92,8 92,92" fill="#EB1C24" />
              <polygon points="50,28 68,78 50,78 44,62 32,78 50,78" fill="#EB1C24" />
            </svg>
            <span>ACS Interns 2026</span>
          </div>
          <div className="footer__links">
            <a href="#">Home</a>
            <a href="#">Gallery</a>
            <a href="#">Teams</a>
            <a href="#">Projects</a>
          </div>
        </footer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>

</html>
